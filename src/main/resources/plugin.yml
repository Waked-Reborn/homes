name: homes
version: '${project.version}'
main: com.wessel.mittenshomes.Homes
api-version: '1.21'
description: "Home plugin - /home, /sethome, /delhome, /homes (max 3 homes)"
author: Wessel

commands:
  home:
    description: Teleport to a home
    usage: /home [name]
    permission: mittenshomes.home
  sethome:
    description: Set a home
    usage: /sethome <name>
    permission: mittenshomes.sethome
  delhome:
    description: Delete a home
    usage: /delhome <name>
    permission: mittenshomes.delhome
  homes:
    description: Open home GUI
    usage: /homes
    permission: mittenshomes.homes

  homeadmin:
    description: Inspect and manage other players' homes
    usage: /homeadmin <players|list|info|tp|delete> [player|uuid] [home name]

permissions:
  mittenshomes.home:
    description: Allows using /home
    default: true
  mittenshomes.sethome:
    description: Allows using /sethome
    default: true
  mittenshomes.delhome:
    description: Allows using /delhome
    default: true
  mittenshomes.homes:
    description: Allows using /homes
    default: true
  mittenshomes.admin:
    description: Grants all home administration actions
    default: op
    children:
      mittenshomes.admin.view: true
      mittenshomes.admin.teleport: true
      mittenshomes.admin.delete: true
  mittenshomes.admin.view:
    description: List home owners and inspect their homes
    default: op
  mittenshomes.admin.teleport:
    description: Teleport to another player's home instantly
    default: op
  mittenshomes.admin.delete:
    description: Delete another player's home
    default: op
